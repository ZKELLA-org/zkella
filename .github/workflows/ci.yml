name: CI

on:
  push:
    branches: [main, compliance-governance-security-testnet-release]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Soroban contracts (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.0"
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: cargo build --workspace --target wasm32v1-none --release
        working-directory: contracts
        run: cargo build --workspace --target wasm32v1-none --release
      - name: cargo test --workspace
        # Release profile: the at-scale Merkle test and the real-WASM cost-parity tests
        # hash thousands of Poseidon inputs in pure Rust, which is impractically slow unoptimised.
        working-directory: contracts
        run: cargo test --workspace --release

  sdk:
    name: SDK and circuits (npm test + typecheck)
    runs-on: ubuntu-latest
    services:
      # Backs the indexer's PostgreSQL tests (tests/unit/indexer-db-postgres.test.ts) —
      # the grant-funded stack, run for real rather than mocked. See indexer/src/db.ts.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zkella
          POSTGRES_PASSWORD: zkella
          POSTGRES_DB: zkella_indexer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zkella -d zkella_indexer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.test.json
      - name: Unit tests
        env:
          DATABASE_URL: postgres://zkella:zkella@localhost:5432/zkella_indexer
        run: npm test -- --maxWorkers=2
      - name: Build circuits and SDK for the browser-worker check
        run: |
          npm run build --workspace=sdk
          npx playwright-core install --with-deps chromium
      - name: Real-browser Web Worker responsiveness check
        run: npm run check:browser-worker

  fuzz:
    name: Fuzz smoke (token + verifier, 60s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly-2026-09-22"
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Run fuzz targets
        working-directory: contracts/token
        # RUSTUP_TOOLCHAIN is required here, not just the rust-toolchain@master
        # step above: rustup's directory-based override (contracts/rust-toolchain.toml,
        # pinning the main workspace to stable) wins over both the job's default
        # toolchain *and* contracts/token/fuzz/rust-toolchain.toml, because this
        # step's CWD (contracts/token) is a descendant of contracts/, not of
        # contracts/token/fuzz/ — confirmed by reproducing the exact failure
        # locally before adding this. The env var is the one override rustup
        # checks before any directory-based file.
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-09-22
        run: |
          for t in shield_arbitrary transfer_arbitrary verifier_arbitrary swap_arbitrary governance_arbitrary compliance_arbitrary viewing_keys_arbitrary token_admin_arbitrary verifier_admin_arbitrary; do
            cargo fuzz run "$t" -- -max_total_time=60 -max_len=1024
          done
